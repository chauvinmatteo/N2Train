[project]
name = "n2train-kanji"
version = "0.1.0"
description = "SRS Kanji trainer for JLPT N2"
authors = [
    {name = "mchauvin"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fsrs>=6.3.2",
    "pyside6-essentials>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
